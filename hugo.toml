      url = "/projects"
    [[params.profileMode.buttons]]
      name = "About"
      url = "/about"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/sadia-jnub"

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 10

