baseURL = "https://sadia-jnub.github.io/"
languageCode = "en-us"
title = "Sadia Joinub"

[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"

[params]
  env = "production"
  description = "Computer Science & Engineering Student | Cybersecurity & Web Development"
  author = "Sadia Joinub"
  defaultTheme = "auto"

  [params.profileMode]
    enabled = true
    title = "Hi, I'm Sadia"
    subtitle = "CSE Undergraduate • Cybersecurity Enthusiast • Builder"
